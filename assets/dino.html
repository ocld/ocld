<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>t-rex runner</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f7f7f7;
      color: #535353;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .interstitial-wrapper {
      width: 100%;
      max-width: 600px;
      padding: 0 16px;
      position: relative;
      height: 170px;
    }
    .runner-container {
      height: 150px;
      max-width: 600px;
      overflow: hidden;
      position: relative;
      width: 600px;
    }
    .runner-canvas {
      height: 150px;
      max-width: 600px;
      position: absolute;
      top: 0;
      left: 0;
    }
    .hint {
      margin-top: 14px;
      font-size: 13px;
      opacity: 0.7;
    }
    #offline-resources { display: none; }
  </style>
</head>

  <div class="hint">press space / up or tap to jump</div>
  <script>
    // bsd-licensed chromium t-rex runner, cleaned to run in all modern browsers
    (function () {
      'use strict';
      var FPS = 60, DEFAULT_WIDTH = 600, IS_HIDPI = window.devicePixelRatio > 1;
      function getRandomNum(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
      function CollisionBox(x, y, w, h) { this.x = x; this.y = y; this.width = w; this.height = h; }
      function boxCompare(a, b) { return a.x < b.x + b.width && a.x + a.width > b.x && a.y < b.y + b.height && a.height + a.y > b.y; }
      function adjBox(box, adj) { return new CollisionBox(box.x + adj.x, box.y + adj.y, box.width, box.height); }
      function checkCollision(ob, trex) {
        if (!ob) return false;
        var tb = new CollisionBox(trex.xPos + 1, trex.yPos + 1, 42, 45);
        var obb = new CollisionBox(ob.xPos + 1, ob.yPos + 1, ob.typeConfig.width * ob.size - 2, ob.typeConfig.height - 2);
        if (!boxCompare(tb, obb)) return false;
        for (var t = 0; t < Trex.collisionBoxes.length; t++) {
          for (var i = 0; i < ob.collisionBoxes.length; i++) {
            if (boxCompare(adjBox(Trex.collisionBoxes[t], tb), adjBox(ob.collisionBoxes[i], obb))) return true;
          }
        }
        return false;
      }

      function Trex(canvas, img) {
        this.ctx = canvas.getContext('2d'); this.image = img; this.xPos = 50;
        this.groundY = 93; this.yPos = 93; this.jumping = false; this.jumpVel = 0;
        this.status = 'WAITING'; this.frame = 0; this.timer = 0; this.speedDrop = false;
      }
      Trex.collisionBoxes = [
        new CollisionBox(1, -1, 30, 26), new CollisionBox(32, 0, 8, 16),
        new CollisionBox(10, 35, 14, 8), new CollisionBox(1, 24, 29, 5),
        new CollisionBox(5, 30, 21, 4), new CollisionBox(9, 34, 15, 4)
      ];
      Trex.frames = { WAITING: [0], RUNNING: [88, 132], JUMPING: [0], CRASHED: [220] };
      Trex.prototype.draw = function (sx) {
        var m = IS_HIDPI ? 2 : 1;
        this.ctx.drawImage(this.image, sx * m, 0, 44 * m, 47 * m, this.xPos, this.yPos, 44, 47);
      };
      Trex.prototype.startJump = function () {
        if (!this.jumping) { this.status = 'JUMPING'; this.jumpVel = -10.5; this.jumping = true; this.speedDrop = false; }
      };
      Trex.prototype.update = function (dt) {
        this.timer += dt;
        if (this.jumping) {
          var f = dt / (1000 / 60);
          this.yPos += Math.round(this.jumpVel * (this.speedDrop ? 3 : 1) * f);
          this.jumpVel += 0.6 * f;
          if (this.yPos >= this.groundY) { this.yPos = this.groundY; this.jumping = false; this.speedDrop = false; this.status = 'RUNNING'; }
        }
        var list = Trex.frames[this.status];
        if (this.timer >= 85) { this.frame = (this.frame + 1) % list.length; this.timer = 0; }
        this.draw(list[this.frame % list.length]);
      };

      var OB_TYPES = [
        { type: 'CACTUS_SMALL', width: 17, height: 35, yPos: 105, minGap: 120, boxes: [new CollisionBox(0,7,5,27), new CollisionBox(4,0,6,34), new CollisionBox(10,4,7,14)] },
        { type: 'CACTUS_LARGE', width: 25, height: 50, yPos: 90, minGap: 120, boxes: [new CollisionBox(0,12,7,38), new CollisionBox(8,0,7,49), new CollisionBox(13,10,10,38)] }
      ];

      function init() {
        var wrap = document.querySelector('.interstitial-wrapper');
        var cont = document.createElement('div'); cont.className = 'runner-container';
        var canvas = document.createElement('canvas'); canvas.className = 'runner-canvas';
        var dpr = IS_HIDPI ? 2 : 1;
        canvas.width = DEFAULT_WIDTH * dpr; canvas.height = 150 * dpr;
        canvas.style.width = DEFAULT_WIDTH + 'px'; canvas.style.height = '150px';
        cont.appendChild(canvas); wrap.appendChild(cont);
        var ctx = canvas.getContext('2d'); ctx.scale(dpr, dpr);
        var p = IS_HIDPI ? '2x-' : '1x-';
        var imgs = {
          TREX: document.getElementById(p + 'trex'), CACTUS_SMALL: document.getElementById(p + 'obstacle-small'),
          CACTUS_LARGE: document.getElementById(p + 'obstacle-large'), CLOUD: document.getElementById(p + 'cloud'),
          HORIZON: document.getElementById(p + 'horizon'), TEXT: document.getElementById(p + 'text'),
          RESTART: document.getElementById(p + 'restart')
        };

        var trex = new Trex(canvas, imgs.TREX);
        var running = false, crashed = false, speed = 6, dist = 0, hi = 0, hOff = 0, obstacles = [], clouds = [{ x: 220, y: 38 }], lastTs = 0;

        function spawnOb() {
          var t = OB_TYPES[getRandomNum(0, 1)];
          var size = speed > 7 ? getRandomNum(1, 3) : getRandomNum(1, 2);
          var w = t.width * size;
          var boxes = t.boxes.map(function (b) { return new CollisionBox(b.x, b.y, b.width, b.height); });
          if (size > 1) { boxes[1].width = w - boxes[0].width - boxes[2].width; boxes[2].x = w - boxes[2].width; }
          obstacles.push({ typeConfig: t, size: size, xPos: DEFAULT_WIDTH + 20, yPos: t.yPos, width: w, collisionBoxes: boxes, gap: getRandomNum(180, 320) });
        }

        function drawDigits(str, x, alpha) {
          ctx.save(); ctx.globalAlpha = alpha;
          var m = IS_HIDPI ? 2 : 1;
          for (var i = 0; i < str.length; i++) {
            var ch = str[i];
            if (ch === ' ') continue;
            var idx = ch === 'H' ? 10 : ch === 'I' ? 11 : parseInt(ch, 10);
            ctx.drawImage(imgs.TEXT, idx * 10 * m, 0, 10 * m, 13 * m, x + i * 11, 10, 10, 13);
          }
          ctx.restore();
        }

        function reset() {
          running = true; crashed = false; speed = 6; dist = 0; obstacles = []; trex.yPos = 93; trex.jumping = false; trex.status = 'RUNNING';
        }

        function trigger() {
          if (crashed) { reset(); return; }
          if (!running) { running = true; trex.status = 'RUNNING'; }
          trex.startJump();
        }

        document.addEventListener('keydown', function (e) {
          if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); trigger(); }
          if (e.code === 'ArrowDown' && trex.jumping) { e.preventDefault(); trex.speedDrop = true; }
        });
        canvas.addEventListener('pointerdown', trigger);

        function loop(ts) {
          var dt = lastTs ? Math.min(40, ts - lastTs) : 16; lastTs = ts;
          ctx.clearRect(0, 0, DEFAULT_WIDTH, 150);
          var m = IS_HIDPI ? 2 : 1;

          if (running && !crashed) {
            var dx = speed * (dt / (1000 / FPS));
            hOff = (hOff + dx) % 600;
            dist += dx * 0.25;
            if (speed < 13) speed += 0.0012;
            for (var c = 0; c < clouds.length; c++) clouds[c].x -= 0.6;
            clouds = clouds.filter(function (c) { return c.x > -50; });
            if (clouds.length < 3 && Math.random() < 0.01) clouds.push({ x: 620, y: getRandomNum(24, 65) });
            for (var o = 0; o < obstacles.length; o++) obstacles[o].xPos -= dx;
            obstacles = obstacles.filter(function (o) { return o.xPos + o.width > 0; });
            if (obstacles.length === 0 || (DEFAULT_WIDTH - obstacles[obstacles.length - 1].xPos) > obstacles[obstacles.length - 1].gap) spawnOb();
          }

          for (var c2 = 0; c2 < clouds.length; c2++) ctx.drawImage(imgs.CLOUD, 0, 0, 46 * m, 14 * m, clouds[c2].x, clouds[c2].y, 46, 14);
          ctx.drawImage(imgs.HORIZON, hOff * m, 0, 600 * m, 12 * m, 0, 127, 600, 12);
          for (var o2 = 0; o2 < obstacles.length; o2++) {
            var ob = obstacles[o2], sw = ob.typeConfig.width * ob.size, sx = sw * 0.5 * (ob.size - 1);
            ctx.drawImage(imgs[ob.typeConfig.type], sx * m, 0, sw * m, ob.typeConfig.height * m, ob.xPos, ob.yPos, sw, ob.typeConfig.height);
          }

          trex.update(running && !crashed ? dt : 0);

          if (running && !crashed && checkCollision(obstacles[0], trex)) {
            crashed = true; trex.status = 'CRASHED'; trex.draw(220);
            if (Math.floor(dist) > hi) hi = Math.floor(dist);
          }

          if (hi > 0) drawDigits('HI ' + String(hi).padStart(5, '0'), DEFAULT_WIDTH - 165, 0.72);
          drawDigits(String(Math.floor(dist)).padStart(5, '0'), DEFAULT_WIDTH - 66, 1);

          if (crashed) {
            ctx.drawImage(imgs.TEXT, 0, 13 * m, 191 * m, 11 * m, (DEFAULT_WIDTH - 191) / 2, 42, 191, 11);
            ctx.drawImage(imgs.RESTART, 0, 0, 36 * m, 32 * m, (DEFAULT_WIDTH - 36) / 2, 68, 36, 32);
          }
          requestAnimationFrame(loop);
        }
        requestAnimationFrame(loop);
      }
      window.addEventListener('load', init);
    })();
  </script>
